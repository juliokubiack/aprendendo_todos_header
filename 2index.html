<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>header lateral</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/stylr.css" />
  </head>
  <body>
    <div class="header" id="header">
      <button onclick="toggleSidebar()" class="btn_icon_header">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="currentColor"
          class="bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
          />
        </svg>
      </button>

      <div class="logo_header">
        <img
          src="./icone-do-globo-com-efeito-gradiente-roxo_197792-4858.avif"
          class="img_logo_header"
          alt="logo_header"
        />
      </div>
      <div
        onclick="toggleSidebar()"
        class="navegation_header"
        id="navegation_header"
      >
        <button class="btn_icon_header">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            class="bi bi-x"
            viewBox="0 0 16 16"
          >
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
            />
          </svg>
        </button>

        <a href="#" class="active">Home</a>
        <a href="#">Curso</a>
        <a href="#">Sobre-nos</a>
        <a href="#">Contate-nos</a>
      </div>
    </div>
    <div tabindex="0" onclick="closeSidebar()" class="content" id="content">
      <h1>Menu Responsivo de Julio Kubiack</h1>
    </div>
  </body>
  <script src="script.js"></script>
</html>
